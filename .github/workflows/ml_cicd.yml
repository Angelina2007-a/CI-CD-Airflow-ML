name: ML CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: Model & Code Unit Testing (CI)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short

  train-evaluate-deploy:
    name: ML Training, Quality Gate & Deployment (CD)
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preprocess Dataset
        run: |
          python src/data_preprocessing.py

      - name: Train ML Model
        run: |
          python src/train.py

      - name: Evaluate Model & Check Quality Gate
        run: |
          python src/evaluate.py

      - name: Deploy Validated Model to Production
        run: |
          python src/deploy.py

      - name: Run Inference Smoke Test
        run: |
          python src/predict.py

      - name: Archive Model & Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-production-model
          path: |
            models/
            production_model/
            data/processed/
